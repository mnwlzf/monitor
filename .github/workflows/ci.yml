# ============================================================
# 持续集成：代码质量门禁
#
#   后端：mvn test        —— 纯单元测试，不依赖数据库/Redis/上游服务
#   前端：typecheck + build
#
# 说明：
#   - 标记为 contract 的联调用例默认被 pom.xml 排除，不会在 CI 中执行
#     （它们依赖真实上游与数据库，需要时手动跑 mvn test -Pcontract-tests）
#   - 本工作流只做校验，不会推送镜像；镜像构建见 docker-publish.yml
# ============================================================
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · mvn test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Run unit tests
        working-directory: backend
        run: mvn -B -ntp test

  frontend:
    name: Frontend · typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build