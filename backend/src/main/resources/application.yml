server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: ${MONITOR_SESSION_TIMEOUT:8h}
      cookie:
        name: ${MONITOR_SESSION_COOKIE_NAME:MONITOR_SESSION}
        http-only: true
        same-site: strict
        secure: ${MONITOR_SESSION_COOKIE_SECURE:false}

spring:
  # 对话式问答（QQ 机器人使用）。
  # 默认 spring.ai.model.chat=none：不配 Key 也能正常启动，机器人只支持命令；
  # 配好 Key 后把它改成 openai 即可开启自然语言问答。
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_MODEL:gpt-4o-mini}
          temperature: ${SPRING_AI_OPENAI_TEMPERATURE:0.2}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: monitor-backend
  datasource:
    hikari:
      # 核心配置：主动、提前回收连接，避免被中间层先断
      max-lifetime: 300000
      # 辅助配置：定期探活，尽量早发现坏连接
      keepalive-time: 60000     # 5分钟
      validation-timeout: 3000    # 3秒，探活超时时间
      # 前提条件：必须有常驻连接，keepalive 才会生效
      minimum-idle: 2             # 确保池中始终有连接可被探活[citation:8]
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monitor}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.monitor.platform.infrastructure.mybatis.handler
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false

monitor:
  # QQ 机器人（OneBot v11 协议，NapCat / Lagrange / go-cqhttp 都支持），默认关闭。
  # 在机器人端把「反向 HTTP 上报」指到 http://<本服务>:8080/api/v1/bot/onebot，
  # 并把 Authorization 配成与 webhook-token 相同的 Bearer 值。
  # 开启后可用命令（/help）或直接自然语言提问（需另配大模型）。
  bot:
    enabled: ${MONITOR_BOT_ENABLED:false}
    webhook-token: ${MONITOR_BOT_WEBHOOK_TOKEN:}
    api-base-url: ${MONITOR_BOT_API_BASE_URL:}
    api-token: ${MONITOR_BOT_API_TOKEN:}
    # 逗号分隔的群号 / QQ；留空表示不限制（建议显式配置，否则任何群都能问）
    allowed-groups: ${MONITOR_BOT_ALLOWED_GROUPS:}
    allowed-users: ${MONITOR_BOT_ALLOWED_USERS:}
    require-mention: ${MONITOR_BOT_REQUIRE_MENTION:true}
    command-prefix: ${MONITOR_BOT_COMMAND_PREFIX:/}
    max-reply-length: ${MONITOR_BOT_MAX_REPLY_LENGTH:900}
    memory-window: ${MONITOR_BOT_MEMORY_WINDOW:10}
    # 长回复渲染成图片：渠道状态、账户余额这类内容动辄上百行，
    # 纯文本会被 max-reply-length 截断，转图片才能完整呈现。
    # 中文字体随 JAR 打包，无需在运行环境装字体；渲染失败时自动退回截断文本。
    image-enabled: ${MONITOR_BOT_IMAGE_ENABLED:true}
    image-width: ${MONITOR_BOT_IMAGE_WIDTH:760}
    # 覆盖内置字体：留空用内置的文泉驿微米黑；填字体名则改用系统字体（一般不用改）
    image-font: ${MONITOR_BOT_IMAGE_FONT:}
    # 身份识别：把自建 Sub2API 的平台用户邮箱同步到 Redis，
    # 用于区分「平台用户 / 陌生人」以及「管理员 / 普通用户」。
    # 数据来源是 monitor.pool.ingest.* 配置的只读库（public.users 表）。
    # 图片理解：用户发的图片会被下载下来、作为多模态消息交给模型识别。
    # 需要模型支持视觉（例如 gpt-4o、Qwen-VL）；不支持时上游会报错，机器人会回一句出错提示。
    vision:
      enabled: ${MONITOR_BOT_VISION_ENABLED:true}
      # 单张图片大小上限（字节），超过直接跳过
      max-image-bytes: ${MONITOR_BOT_VISION_MAX_BYTES:8388608}
      # 单条消息最多处理几张图
      max-images-per-message: ${MONITOR_BOT_VISION_MAX_IMAGES:3}
      timeout: ${MONITOR_BOT_VISION_TIMEOUT:15s}

    # 消息存档：记录「谁说了什么、机器人回了什么、当时是什么身份」，
    # 用于事后查证。写入是 best-effort，失败不影响机器人回复。
    archive:
      enabled: ${MONITOR_BOT_ARCHIVE_ENABLED:true}
      # 保留天数，超过的由定时任务清理；0 或负数表示永久保留
      retention-days: ${MONITOR_BOT_ARCHIVE_RETENTION_DAYS:90}
      max-content-length: 4000
      max-page-size: 500
    identity:
      enabled: ${MONITOR_BOT_IDENTITY_ENABLED:true}
      # 允许按 <QQ号>@xx.com 的邮箱自动匹配 QQ，无需手动绑定
      qq-local-part-match: ${MONITOR_BOT_IDENTITY_QQ_MATCH:true}

  # 天气查询（uapis.cn 免费接口，无需注册与 Key）。
  # 与平台无关，因此管理员 / 平台用户 / 陌生人都能用。
  weather:
    enabled: ${MONITOR_WEATHER_ENABLED:true}
    base-url: ${MONITOR_WEATHER_BASE_URL:https://uapis.cn}
    timeout: ${MONITOR_WEATHER_TIMEOUT:8s}
    # 同一城市的缓存时长：免费额度按次计，群里反复问同一个城市没必要每次都打接口
    cache-ttl: ${MONITOR_WEATHER_CACHE_TTL:10m}
    # 默认预报天数（0 表示只查当前天气）
    default-forecast-days: ${MONITOR_WEATHER_FORECAST_DAYS:3}

  # 上游请求伪装：默认使用内置的浏览器 User-Agent / Accept-Language，
  # 可用 MONITOR_UPSTREAM_USER_AGENT、MONITOR_UPSTREAM_ACCEPT_LANGUAGE 环境变量覆盖。
  upstream: {}

  # 号池直连库增量采集（可选）
  #   自建 Sub2API 的 usage_logs.id 是 BIGSERIAL，可直接做真增量；
  #   配置后由 pool-samples-db 任务每 30 秒按 id 游标同步，数据滞后可到 30 秒级。
  #   不配置（enabled=false）时该任务每轮直接跳过，走 admin 接口的 pool-samples 采集。
  #   建议上游只给 SELECT 权限的只读账号。
  pool:
    ingest:
      enabled: ${SUB2API_DB_ENABLED:false}
      url: ${SUB2API_DB_URL:}
      username: ${SUB2API_DB_USERNAME:}
      password: ${SUB2API_DB_PASSWORD:}
      batch-size: ${SUB2API_DB_BATCH_SIZE:2000}
      max-batches-per-run: ${SUB2API_DB_MAX_BATCHES:20}
  # 登录与权限：ADMIN 可读写，VIEWER 只读
  security:
    enabled: ${MONITOR_SECURITY_ENABLED:true}
    users:
      - username: ${MONITOR_ADMIN_USERNAME:admin}
        password: ${MONITOR_ADMIN_PASSWORD:}
        roles:
          - ADMIN
  # 定时任务框架配置
  scheduling:
    pool-size: 4
    thread-name-prefix: scheduled-task-
    await-termination-seconds: 30
  # 采集线程池配置
  collection:
    pool-size: 8
    queue-capacity: 200
