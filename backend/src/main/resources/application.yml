server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: ${MONITOR_SESSION_TIMEOUT:8h}
      cookie:
        name: ${MONITOR_SESSION_COOKIE_NAME:MONITOR_SESSION}
        http-only: true
        same-site: strict
        secure: ${MONITOR_SESSION_COOKIE_SECURE:false}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: monitor-backend
  datasource:
    hikari:
      # 核心配置：主动、提前回收连接，避免被中间层先断
      max-lifetime: 300000
      # 辅助配置：定期探活，尽量早发现坏连接
      keepalive-time: 60000     # 5分钟
      validation-timeout: 3000    # 3秒，探活超时时间
      # 前提条件：必须有常驻连接，keepalive 才会生效
      minimum-idle: 2             # 确保池中始终有连接可被探活[citation:8]
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monitor}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.monitor.platform.infrastructure.mybatis.handler
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false

monitor:
  # 上游请求伪装：默认使用内置的浏览器 User-Agent / Accept-Language，
  # 可用 MONITOR_UPSTREAM_USER_AGENT、MONITOR_UPSTREAM_ACCEPT_LANGUAGE 环境变量覆盖。
  upstream: {}

  # 号池直连库增量采集（可选）
  #   自建 Sub2API 的 usage_logs.id 是 BIGSERIAL，可直接做真增量；
  #   配置后由 pool-samples-db 任务每 30 秒按 id 游标同步，数据滞后可到 30 秒级。
  #   不配置（enabled=false）时该任务每轮直接跳过，走 admin 接口的 pool-samples 采集。
  #   建议上游只给 SELECT 权限的只读账号。
  pool:
    ingest:
      enabled: ${SUB2API_DB_ENABLED:false}
      url: ${SUB2API_DB_URL:}
      username: ${SUB2API_DB_USERNAME:}
      password: ${SUB2API_DB_PASSWORD:}
      batch-size: ${SUB2API_DB_BATCH_SIZE:2000}
      max-batches-per-run: ${SUB2API_DB_MAX_BATCHES:20}
  # 登录与权限：ADMIN 可读写，VIEWER 只读
  security:
    enabled: ${MONITOR_SECURITY_ENABLED:true}
    users:
      - username: ${MONITOR_ADMIN_USERNAME:admin}
        password: ${MONITOR_ADMIN_PASSWORD:}
        roles:
          - ADMIN
  # 定时任务框架配置
  scheduling:
    pool-size: 4
    thread-name-prefix: scheduled-task-
    await-termination-seconds: 30
  # 采集线程池配置
  collection:
    pool-size: 8
    queue-capacity: 200
