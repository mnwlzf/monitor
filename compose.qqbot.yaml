# ============================================================
# QQ 机器人（OneBot v11）：只跑 NapCat，配合已有的 monitor 服务使用。
#
# 用法（在放本文件的目录里执行）：
#   1) docker compose -f compose.qqbot.yaml up -d
#   2) docker compose -f compose.qqbot.yaml logs napcat   # 拿 WebUI 登录 token
#   3) 浏览器打开 http://127.0.0.1:6099/webui 扫码登录 QQ（建议用**小号**）
#   4) 在 WebUI 的「网络配置」里：
#        - 开启 HTTP 服务端（默认 3000）→ monitor 通过它发消息
#        - 开启 HTTP 客户端 / 反向 HTTP 上报，地址填：
#            http://monitor:8080/api/v1/bot/onebot
#          Authorization 填：Bearer <与 MONITOR_BOT_WEBHOOK_TOKEN 相同>
#   5) 回到 monitor 目录打开 MONITOR_BOT_ENABLED=true 并重启
#
# 本文件不需要 .env：端口、数据目录都直接写在这里，要改就改本文件。
# 唯一的 .env 是 monitor 自己的（/app/monitor/.env）。
#
# 两个容器怎么互访：
#   本服务把 napcat 挂到 monitor 项目的默认网络 monitor_default 上，
#   两边直接用容器名互访，不经过宿主机端口：
#     monitor → napcat:3000（MONITOR_BOT_API_BASE_URL）
#     napcat  → monitor:8080（反向上报地址）
#   所以必须先起 monitor（它会创建 monitor_default），再起 napcat。
# ============================================================
name: monitor-qqbot

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      # Linux 下可改成 `id -u` / `id -g` 的值；Docker Desktop（Win/mac）保持 0
      NAPCAT_UID: 0
      NAPCAT_GID: 0
    ports:
      # WebUI：扫码登录 + 配置 OneBot 网络。只绑 127.0.0.1，
      # 远程访问请用 SSH 隧道：ssh -L 6099:127.0.0.1:6099 root@<服务器IP>
      - "127.0.0.1:6099:6099"
      # OneBot HTTP API：容器内固定 3000；宿主机 5000 只用于本机排查，
      # monitor 走 Docker 网络直接用 napcat:3000，不依赖这个映射。
      - "127.0.0.1:5000:3000"
    volumes:
      # 登录态与配置，重启免扫码。宿主机侧固定放 /app/napcat 下；
      # 部署目录不同就改这三行。
      - /app/napcat/qq:/app/.config/QQ
      - /app/napcat/config:/app/napcat/config
      - /app/napcat/plugins:/app/napcat/plugins
    extra_hosts:
      # 保留 host.docker.internal：排查问题时可以直接从容器里 curl 宿主机
      - "host.docker.internal:host-gateway"

networks:
  # 复用 monitor 项目的默认网络：compose.yaml 里 name: monitor，所以网络叫 monitor_default。
  # 前提：monitor 那套已经起来（docker compose -f compose.yaml up -d）。
  default:
    name: monitor_default
    external: true