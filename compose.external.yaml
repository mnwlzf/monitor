# 只启动 Monitor 应用容器，数据库与 Redis 使用外部已有服务。
# 环境变量命名与项目原始 compose.yaml 保持一致（POSTGRES_* 仅内置基础设施场景使用）。
# 使用方式：
#   1) cp .env.example .env 并按外部数据库/Redis 地址填写
#   2) docker compose -f compose.external.yaml up -d
name: monitor

services:
  app:
    image: ${MONITOR_IMAGE:-ghcr.io/mnwlzf/monitor:latest}
    container_name: monitor
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: ${REDIS_HOST:?Set REDIS_HOST in .env}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      UPSTREAM_CREDENTIAL_KEY: ${UPSTREAM_CREDENTIAL_KEY:?Set UPSTREAM_CREDENTIAL_KEY in .env}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -Dfile.encoding=UTF-8}
      LOGGING_FILE_NAME: /app/logs/monitor.log
      # 登录与权限
      MONITOR_ADMIN_USERNAME: ${MONITOR_ADMIN_USERNAME:?Set MONITOR_ADMIN_USERNAME in .env}
      MONITOR_ADMIN_PASSWORD: ${MONITOR_ADMIN_PASSWORD:?Set MONITOR_ADMIN_PASSWORD in .env}
      MONITOR_SECURITY_ENABLED: ${MONITOR_SECURITY_ENABLED:-true}
      MONITOR_SESSION_TIMEOUT: ${MONITOR_SESSION_TIMEOUT:-8h}
      MONITOR_SESSION_COOKIE_NAME: ${MONITOR_SESSION_COOKIE_NAME:-MONITOR_SESSION}
      MONITOR_SESSION_COOKIE_SECURE: ${MONITOR_SESSION_COOKIE_SECURE:-false}
      # 号池直连库增量采集（可选）：指向自建 Sub2API 的 PostgreSQL，建议用只读账号
      SUB2API_DB_ENABLED: ${SUB2API_DB_ENABLED:-false}
      SUB2API_DB_URL: ${SUB2API_DB_URL:-}
      SUB2API_DB_USERNAME: ${SUB2API_DB_USERNAME:-}
      SUB2API_DB_PASSWORD: ${SUB2API_DB_PASSWORD:-}
      SUB2API_DB_BATCH_SIZE: ${SUB2API_DB_BATCH_SIZE:-2000}
      SUB2API_DB_MAX_BATCHES: ${SUB2API_DB_MAX_BATCHES:-20}
      # QQ 机器人（OneBot v11）与大模型（Spring AI），默认关闭
      MONITOR_BOT_ENABLED: ${MONITOR_BOT_ENABLED:-false}
      MONITOR_BOT_WEBHOOK_TOKEN: ${MONITOR_BOT_WEBHOOK_TOKEN:-}
      # 默认直连同 compose 内的 napcat 容器（容器内端口固定 3000）
      MONITOR_BOT_API_BASE_URL: ${MONITOR_BOT_API_BASE_URL:-http://napcat:3000}
      MONITOR_BOT_API_TOKEN: ${MONITOR_BOT_API_TOKEN:-}
      MONITOR_BOT_ALLOWED_GROUPS: ${MONITOR_BOT_ALLOWED_GROUPS:-}
      MONITOR_BOT_ALLOWED_USERS: ${MONITOR_BOT_ALLOWED_USERS:-}
      MONITOR_BOT_REQUIRE_MENTION: ${MONITOR_BOT_REQUIRE_MENTION:-true}
      MONITOR_BOT_COMMAND_PREFIX: ${MONITOR_BOT_COMMAND_PREFIX:-/}
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-}
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-https://api.openai.com}
      SPRING_AI_OPENAI_MODEL: ${SPRING_AI_OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    # 数据库/Redis 若部署在宿主机，可用 host.docker.internal 访问
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ============================================================
  # QQ 机器人（OneBot v11）：和 app 在同一个 compose 网络里，直接用容器名互访。
  #   app    → napcat:3000    发消息（MONITOR_BOT_API_BASE_URL）
  #   napcat → monitor:8080   反向 HTTP 上报（/api/v1/bot/onebot）
  #
  # 首次使用：
  #   1) docker compose logs napcat          拿 WebUI 的 token
  #   2) 本机执行 ssh -L 6099:127.0.0.1:6099 root@<服务器IP>，
  #      浏览器打开 http://127.0.0.1:6099/webui?token=<token> 扫码登录 QQ（建议小号）
  #   3) 在 WebUI 的「网络配置」里开：
  #        - HTTP 服务端 0.0.0.0:3000
  #        - 反向 HTTP 上报 http://monitor:8080/api/v1/bot/onebot
  #          Header: Authorization: Bearer <MONITOR_BOT_WEBHOOK_TOKEN>
  #   4) .env 里设 MONITOR_BOT_ENABLED=true 后重启 app
  #
  # 不用 QQ 机器人时：删掉这个服务，或只起需要的服务
  #   docker compose up -d app postgres redis
  # ============================================================
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      # Linux 下可改成 `id -u` / `id -g`；Docker Desktop（Win/mac）保持 0
      NAPCAT_UID: 0
      NAPCAT_GID: 0
    ports:
      # WebUI：扫码登录 + 配置 OneBot 网络（只绑 127.0.0.1，远程用 SSH 隧道）
      - "127.0.0.1:6099:6099"
      # OneBot HTTP API：容器内固定 3000；宿主机 5000 仅供本机排查，
      # app 走 compose 网络直连 napcat:3000，不依赖这个映射。
      - "127.0.0.1:5000:3000"
    volumes:
      # 登录态与配置，重启免扫码；部署目录不同就改这三行
      - /app/napcat/qq:/app/.config/QQ
      - /app/napcat/config:/app/napcat/config
      - /app/napcat/plugins:/app/napcat/plugins
