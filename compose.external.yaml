# 只启动 Monitor 应用容器，数据库与 Redis 使用外部已有服务。
# 环境变量命名与项目原始 compose.yaml 保持一致（POSTGRES_* 仅内置基础设施场景使用）。
# 使用方式：
#   1) cp .env.example .env 并按外部数据库/Redis 地址填写
#   2) docker compose -f compose.external.yaml up -d
name: monitor

services:
  app:
    image: ${MONITOR_IMAGE:-ghcr.io/mnwlzf/monitor:latest}
    container_name: monitor
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: ${REDIS_HOST:?Set REDIS_HOST in .env}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      UPSTREAM_CREDENTIAL_KEY: ${UPSTREAM_CREDENTIAL_KEY:?Set UPSTREAM_CREDENTIAL_KEY in .env}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -Dfile.encoding=UTF-8}
      LOGGING_FILE_NAME: /app/logs/monitor.log
      # 登录与权限
      MONITOR_ADMIN_USERNAME: ${MONITOR_ADMIN_USERNAME:?Set MONITOR_ADMIN_USERNAME in .env}
      MONITOR_ADMIN_PASSWORD: ${MONITOR_ADMIN_PASSWORD:?Set MONITOR_ADMIN_PASSWORD in .env}
      MONITOR_SECURITY_ENABLED: ${MONITOR_SECURITY_ENABLED:-true}
      MONITOR_SESSION_TIMEOUT: ${MONITOR_SESSION_TIMEOUT:-8h}
      MONITOR_SESSION_COOKIE_NAME: ${MONITOR_SESSION_COOKIE_NAME:-MONITOR_SESSION}
      MONITOR_SESSION_COOKIE_SECURE: ${MONITOR_SESSION_COOKIE_SECURE:-false}
      # 号池直连库增量采集（可选）：指向自建 Sub2API 的 PostgreSQL，建议用只读账号
      SUB2API_DB_ENABLED: ${SUB2API_DB_ENABLED:-false}
      SUB2API_DB_URL: ${SUB2API_DB_URL:-}
      SUB2API_DB_USERNAME: ${SUB2API_DB_USERNAME:-}
      SUB2API_DB_PASSWORD: ${SUB2API_DB_PASSWORD:-}
      SUB2API_DB_BATCH_SIZE: ${SUB2API_DB_BATCH_SIZE:-2000}
      SUB2API_DB_MAX_BATCHES: ${SUB2API_DB_MAX_BATCHES:-20}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    # 数据库/Redis 若部署在宿主机，可用 host.docker.internal 访问
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
